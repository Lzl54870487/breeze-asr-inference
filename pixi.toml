[project]
name = "stt-test"
version = "0.1.0"
description = "Breeze ASR 25 - USB Microphone Speech-to-Text"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
run = "python run.py"
list-devices = "python -c \"import sounddevice; print(sounddevice.query_devices())\""

[dependencies]
python = ">=3.11,<3.13"
pip = ">=25"
python-sounddevice = ">=0.5.1,<0.5.2"
numpy = ">=1.26.0"

[pypi-dependencies]
faster-whisper = ">=1.1.0"
soundfile = ">=0.12.0"
