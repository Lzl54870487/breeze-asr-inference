[project]
name = "stt-test"
version = "0.1.0"
description = "Breeze ASR 25 - USB Microphone Speech-to-Text"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
install-torch = "pip install --force-reinstall --no-deps torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cu126"
run = { cmd = "python run.py", depends-on = ["install-torch"] }
list-devices = "python -c \"import sounddevice; print(sounddevice.query_devices())\""

[dependencies]
python = ">=3.11,<3.13"
pip = ">=25"
python-sounddevice = ">=0.5.1,<0.5.2"
numpy = ">=1.26.0"

[pypi-dependencies]
transformers = ">=4.50.0"
accelerate = ">=1.4.0"
datasets = ">=3.0.0"
soundfile = ">=0.12.0"
